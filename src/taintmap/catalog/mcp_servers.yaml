# Well-known MCP servers and the capabilities their tools provide.
#
# A server in an MCP config matches an entry when one of these is true:
# - packages: an argument equals the package name, optionally followed by `@<version>`
#   (npx, uvx, pipx and similar launchers)
# - images: an argument equals the container image, optionally followed by `:<tag>` or `@<digest>`
# - urls: the server's `url` equals one of these, ignoring a trailing slash
#
# Each capability maps to one taxonomy category: a `source.untrusted.*` category when a tool returns
# content that outsiders can write, or a `sink.*` category when a tool can cause harm. `tools` lists
# tool names copied from the server's README; it may be empty when the README does not list them.
#
# Schema: schemas/mcp_servers.schema.json. Every entry needs an `evidence` link.
version: 1

servers:
  - id: github
    description: GitHub's official MCP server (local container or remote endpoint).
    match:
      packages: []
      images: [ghcr.io/github/github-mcp-server]
      urls: [https://api.githubcopilot.com/mcp/]
    capabilities:
      - category: source.untrusted.issue_text
        description: Reads issues and issue comments written by anyone who can open an issue.
        tools: [issue_read, list_issues, search_issues]
      - category: source.untrusted.pr_content
        description: Reads pull requests, which may come from forks.
        tools: []
      - category: sink.repo.write
        description: Creates and edits issues, comments, labels and pull requests.
        tools: [issue_write, add_issue_comment, update_issue_comment, sub_issue_write, label_write, create_pull_request]
      - category: sink.data.read_sensitive
        description: Reads repositories the token can access, including private ones.
        tools: []
      - category: sink.network.outbound
        description: Posts issues, comments and pull requests where other people can read them.
        tools: [issue_write, add_issue_comment, create_pull_request]
    evidence: https://github.com/github/github-mcp-server/blob/main/README.md
    notes: >-
      Default toolsets are context, repos, issues, pull_requests and users. `--read-only` and
      `--toolsets` (or GITHUB_TOOLSETS) narrow what is exposed.

  - id: github-archived
    description: The archived reference GitHub server, replaced by github/github-mcp-server.
    match:
      packages: ["@modelcontextprotocol/server-github"]
      images: [mcp/github]
      urls: []
    capabilities:
      - category: source.untrusted.issue_text
        description: Reads issues written by anyone who can open an issue.
        tools: [get_issue, list_issues, search_issues]
      - category: source.untrusted.pr_content
        description: Reads pull requests, their files and comments.
        tools: [get_pull_request, get_pull_request_files, get_pull_request_comments, get_pull_request_reviews]
      - category: sink.repo.write
        description: Writes files, pushes, creates branches and merges pull requests.
        tools: [create_or_update_file, push_files, create_branch, create_repository, fork_repository, merge_pull_request, update_issue, update_pull_request_branch, create_pull_request_review]
      - category: sink.data.read_sensitive
        description: Reads file contents and searches code in repositories the token can access.
        tools: [get_file_contents, search_code, list_commits]
      - category: sink.network.outbound
        description: Posts issues, comments and pull requests where other people can read them.
        tools: [create_issue, add_issue_comment, create_pull_request]
    evidence: https://github.com/modelcontextprotocol/servers-archived/blob/main/src/github/README.md

  - id: filesystem
    description: Reference filesystem server limited to the allowed directories given as arguments.
    match:
      packages: ["@modelcontextprotocol/server-filesystem"]
      images: [mcp/filesystem]
      urls: []
    capabilities:
      - category: sink.data.write
        description: Writes, edits, moves and copies files in the allowed directories.
        tools: [write_file, append_file, edit_file, create_directory, move_file, copy_file]
      - category: sink.data.read_sensitive
        description: Reads any file in the allowed directories, which may hold credentials.
        tools: [read_text_file, read_media_file, read_multiple_files, search_files]
    evidence: https://github.com/modelcontextprotocol/servers/blob/main/src/filesystem/README.md

  - id: git
    description: Reference Git server that reads and changes a local repository.
    match:
      packages: [mcp-server-git]
      images: [mcp/git]
      urls: []
    capabilities:
      - category: sink.data.write
        description: Stages, commits, resets, creates branches, checks out and merges in the local repository.
        tools: [git_add, git_commit, git_reset, git_create_branch, git_checkout, git_merge]
    evidence: https://github.com/modelcontextprotocol/servers/blob/main/src/git/README.md

  - id: fetch
    description: Reference server that fetches web pages and converts them for the model.
    match:
      packages: [mcp-server-fetch]
      images: [mcp/fetch]
      urls: []
    capabilities:
      - category: source.untrusted.web_content
        description: Returns the content of arbitrary web pages.
        tools: [fetch]
      - category: sink.network.outbound
        description: Requests any URL the model chooses, which can carry data in the URL.
        tools: [fetch]
    evidence: https://github.com/modelcontextprotocol/servers/blob/main/src/fetch/README.md
    notes: Private and loopback addresses are refused unless `--allow-private-ips` is passed.

  - id: postgres
    description: Archived reference PostgreSQL server; runs queries in a read-only transaction.
    match:
      packages: ["@modelcontextprotocol/server-postgres"]
      images: [mcp/postgres]
      urls: []
    capabilities:
      - category: sink.data.read_sensitive
        description: Runs read-only SQL queries against the configured database.
        tools: [query]
    evidence: https://github.com/modelcontextprotocol/servers-archived/blob/main/src/postgres/README.md

  - id: puppeteer
    description: Archived reference browser automation server based on Puppeteer.
    match:
      packages: ["@modelcontextprotocol/server-puppeteer"]
      images: [mcp/puppeteer]
      urls: []
    capabilities:
      - category: source.untrusted.web_content
        description: Returns content from web pages the browser visits.
        tools: [puppeteer_navigate, puppeteer_screenshot, puppeteer_evaluate]
      - category: sink.network.outbound
        description: Navigates to and submits forms on arbitrary sites.
        tools: [puppeteer_navigate, puppeteer_fill, puppeteer_click]
      - category: sink.data.read_sensitive
        description: The README warns it can access local files and local or internal IP addresses.
        tools: [puppeteer_navigate]
    evidence: https://github.com/modelcontextprotocol/servers-archived/blob/main/src/puppeteer/README.md

  - id: playwright
    description: Microsoft's Playwright browser automation server.
    match:
      packages: ["@playwright/mcp"]
      images: [mcr.microsoft.com/playwright/mcp]
      urls: []
    capabilities:
      - category: source.untrusted.web_content
        description: Returns content from web pages the browser visits.
        tools: [browser_navigate, browser_evaluate]
      - category: sink.network.outbound
        description: Navigates to arbitrary sites and uploads files to them.
        tools: [browser_navigate, browser_file_upload]
    evidence: https://github.com/microsoft/playwright-mcp/blob/main/README.md

  - id: slack
    description: Archived reference Slack server.
    match:
      packages: ["@modelcontextprotocol/server-slack"]
      images: [mcp/slack]
      urls: []
    capabilities:
      - category: source.untrusted.chat
        description: Reads channel history and thread replies written by workspace members.
        tools: [slack_get_channel_history, slack_get_thread_replies]
      - category: sink.network.outbound
        description: Posts messages and replies to channels.
        tools: [slack_post_message, slack_reply_to_thread]
    evidence: https://github.com/modelcontextprotocol/servers-archived/blob/main/src/slack/README.md
