[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taintmap"
version = "0.0.1"
description = "Map how untrusted input flows through AI agents, automations and code to sensitive actions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aakash Siwach" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "networkx>=3",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx",
]

[project.scripts]
taintmap = "taintmap.cli:app"

[project.entry-points."taintmap.parsers"]
github_actions = "taintmap.parsers.github_actions:GithubActionsParser"
mcp_config = "taintmap.parsers.mcp_config:McpConfigParser"

[project.urls]
Homepage = "https://github.com/aakashsiwach/taintmap"

[tool.hatch.build.targets.wheel]
packages = ["src/taintmap"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
