on: discussion
permissions: read-all
jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/run-gemini-cli@v0
        env:
          DEPLOY_TOKEN: ${{ secrets.FAKE_DEPLOY_TOKEN }}
        with:
          prompt: "Answer: ${{ github.event.discussion.body }}"
          gemini_api_key: ${{ secrets.FAKE_GEMINI_KEY }}
