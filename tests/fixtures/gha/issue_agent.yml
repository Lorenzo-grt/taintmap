name: issue agent
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent
        uses: anthropics/claude-code-action@v1
        with:
          prompt: "Label this issue: ${{ github.event.issue.title }}"
          anthropic_api_key: ${{ secrets.FAKE_ANTHROPIC_KEY }}
