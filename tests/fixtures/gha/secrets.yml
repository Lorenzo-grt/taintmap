on: push
permissions: read-all
env:
  WF_TOKEN: ${{ secrets.FAKE_WORKFLOW_TOKEN }}
jobs:
  use:
    runs-on: ubuntu-latest
    env:
      JOB_TOKEN: ${{ secrets['FAKE_JOB_TOKEN'] }}
    steps:
      - uses: some/action@v1
        with:
          token: ${{ secrets.FAKE_WITH_TOKEN }}
          other: plain
      - env:
          A: ${{ secrets.FAKE_A }}-${{ secrets.FAKE_B }}
        run: ./deploy.sh
