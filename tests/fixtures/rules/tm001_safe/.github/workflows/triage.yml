on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  triage:
    if: github.event.issue.author_association == 'MEMBER'
    runs-on: ubuntu-latest
    steps:
      - uses: openai/codex-action@v1
        with:
          prompt: "Fix the bug described here: ${{ github.event.issue.body }}"
